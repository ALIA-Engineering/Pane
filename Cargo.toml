[package]
name = "pane"
version = "0.4.1"
edition = "2024"
authors = ["Tushar Sharma <Txshar@proton.me>"]
description = "A transparent window into your system. GPU-aware system monitor with per-process VRAM and NVML power-limit control."
repository = "https://github.com/TxsharDev/pane"
license = "MIT"
readme = "README.md"
keywords = ["system-monitor", "gpu", "tui", "performance", "nvidia"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "pane"
path = "src/main.rs"

[[bin]]
name = "pane-tui"
path = "src/tui_main.rs"
required-features = ["tui"]

[dependencies]
# GUI
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.31", features = ["image"] }
egui_plot = "0.31"

# TUI (optional, for pane-tui binary)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

# Core
sysinfo = "0.34"
color-eyre = "0.6"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
nvml-wrapper = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
# PDH (Performance Data Helper) - per-process GPU counters, see src/metrics/gpu/pdh.rs
windows = { version = "0.62", features = ["Win32_System_Performance", "Win32_UI_Shell"] }

[features]
default = ["nvidia", "tui"]
# NVIDIA support via NVML. Currently always compiled in; the flag exists so the
# CI matrix can name it explicitly and so an AMD backend can be added later.
nvidia = []
# Builds the secondary `pane-tui` ratatui binary.
tui = ["dep:ratatui", "dep:crossterm"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = true
opt-level = 2
codegen-units = 1
